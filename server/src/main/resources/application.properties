spring.application.name=server
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:ites}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
auth.jwt.secret=${AUTH_JWT_SECRET}
auth.access-token-ttl=PT15M
auth.refresh-token-ttl=P30D
auth.browser.allowed-origins=${AUTH_BROWSER_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081}
auth.browser.secure-cookie=${AUTH_COOKIE_SECURE:false}
auth.totp-encryption-key=${AUTH_TOTP_ENCRYPTION_KEY}
auth.session-max-ttl=P90D
auth.refresh-reuse-grace=PT15S
auth.signup-link-ttl=PT30M
auth.reset-link-ttl=PT30M
auth.email-change-link-ttl=PT24H
auth.two-factor-challenge-ttl=PT5M
auth.resend-cooldown=PT60S
mailer.enabled=${MAILER_ENABLED:false}
mailer.api-url=${MAILER_API_URL:https://api.resend.com}
mailer.api-key=${RESEND_API_KEY:}
mailer.from-name=${MAIL_FROM_NAME:ITES}
mailer.from-address=${MAIL_FROM_ADDRESS:}
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
